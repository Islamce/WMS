name: Manual production release

# Deploys a reviewed commit to the VPS at /opt/apps/wms under Docker Compose.
#
# This workflow previously targeted the shared host that was retired on
# 2026-09-06: ~/domains/wms.kynox.io, the /opt/alt/alt-nodejs20 Node runtime and
# a Passenger tmp/restart.txt restart. None of that exists any more. The backup
# workflow was retargeted during that migration; this one was not, so it sat
# dispatchable and broken — which is worse than having no automation, because it
# would either fail or act on a path that is not production while looking like it
# had worked.
#
# It could not be rehearsed against production before its first use, so the risk
# is engineered out rather than accepted:
#
#   * plan_only defaults to TRUE. The first dispatch changes nothing and proves
#     the plumbing — SSH, paths, the checkout, container health, the database.
#   * A verified backup is taken before anything is touched, using the same
#     scripts the backup workflow already runs in production.
#   * The currently deployed commit is recorded first and used as an automatic
#     rollback target if health or the post-checks fail.
#   * Row counts are compared before and after. A schema migration that changes
#     a row count is a stop-and-investigate event, not a warning.
#   * Any failure — the deploy itself, health, or the post-checks — rolls back to
#     the recorded commit automatically. A failed `docker compose build` matters
#     as much as a failed health check: the checkout has already moved while the
#     old container is still serving, so production stays UP and the mismatch is
#     easy to miss until someone's next `docker compose up -d` ships unvalidated
#     code.
#
# NOTE: the `production` environment below is used for its deployment URL. It has
# no required reviewers configured, so dispatching this with plan_only unchecked
# deploys immediately — there is no approval prompt. Add reviewers in the
# environment settings if that gate is wanted.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full 40-character commit SHA from main to deploy.
        required: true
        type: string
      plan_only:
        description: Report what would happen and change nothing. Leave true until a plan run looks right.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wms-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate requested release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.release_ref }}

  deploy:
    name: Deploy to the VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://wms.kynox.io/healthz
    env:
      REMOTE_APP_DIR: /opt/apps/wms
      CONTAINER_BACKUP_DIR: /app/backups
      REMOTE_DB_PATH: /app/data/wms.db
      HEALTH_URL: https://wms.kynox.io/healthz
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify the release ref is the current main commit
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_ref must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          main_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_REF" != "$main_sha" ]]; then
            echo "::error::release_ref $RELEASE_REF is not the current main commit ($main_sha)."
            exit 1
          fi
          echo "Release ref matches main."

      - name: Configure SSH (pinned known_hosts; StrictHostKeyChecking on)
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${KNOWN_HOSTS:-}" ]; then echo "::error::HOSTINGER_KNOWN_HOSTS secret is required"; exit 1; fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_release
          chmod 600 ~/.ssh/id_release
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host hostinger"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_release"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Everything below is read-only until the deploy step, so a plan run
      # exercises every assumption this workflow makes without changing anything.
      - name: Record the currently deployed commit (the rollback target)
        id: current
        run: |
          set -Eeuo pipefail
          if ! ssh hostinger "test -d '$REMOTE_APP_DIR/.git'"; then
            echo "::error::$REMOTE_APP_DIR is not a git checkout, so there is no rollback target and no way to move it to a commit. Deploy by hand and reconcile the directory first (docs/DEPLOY-PROMPT-VPS.md)."
            exit 1
          fi
          sha="$(ssh hostinger "git -C '$REMOTE_APP_DIR' rev-parse HEAD")"
          echo "current_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: $sha"
          if [ "$sha" = "${{ inputs.release_ref }}" ]; then
            echo "::notice::Production is already at this commit. A deploy would be a no-op."
          fi

      - name: Pre-flight state
        id: before
        run: |
          set -Eeuo pipefail
          ssh hostinger "cd '$REMOTE_APP_DIR' && docker compose ps"
          counts="$(ssh hostinger "cd '$REMOTE_APP_DIR' && docker compose exec -T wms node -e \"
            const db = require('better-sqlite3')('$REMOTE_DB_PATH', {readonly:true});
            const n = (t) => db.prepare('SELECT COUNT(*) c FROM ' + t).get().c;
            console.log(JSON.stringify({
              migrations: n('schema_migrations'), users: n('users'), materials: n('materials'),
              batches: n('batches'), requests: n('material_request_headers'),
              integrity: db.pragma('integrity_check')[0].integrity_check,
            }));
          \"")"
          echo "Before: $counts"
          echo "counts=$counts" >> "$GITHUB_OUTPUT"
          node -e "
            const s = JSON.parse(process.argv[1]);
            if (s.integrity !== 'ok') { console.error('::error::Database integrity is ' + s.integrity + '. Do not deploy on top of a sick database.'); process.exit(1); }
          " "$counts"

      - name: Back up and verify before changing anything
        if: ${{ !inputs.plan_only }}
        run: |
          set -Eeuo pipefail
          ssh hostinger "set -e; cd '$REMOTE_APP_DIR'; \
            docker compose exec -T -e BACKUP_DIR='$CONTAINER_BACKUP_DIR' -e DB_PATH='$REMOTE_DB_PATH' wms node scripts/backup.js; \
            docker compose exec -T -e BACKUP_DIR='$CONTAINER_BACKUP_DIR' wms node scripts/verify-backup.js"
          echo "Backup taken and verified."

      - name: Plan only — stop here
        if: ${{ inputs.plan_only }}
        env:
          CURRENT: ${{ steps.current.outputs.current_sha }}
        run: |
          echo "PLAN ONLY — nothing was changed."
          echo "  would deploy : ${{ inputs.release_ref }}"
          echo "  from         : $CURRENT"
          echo "SSH, the checkout, container health and the database all responded."
          echo "Re-dispatch with plan_only unchecked to deploy."

      - name: Deploy
        id: deploy
        if: ${{ !inputs.plan_only }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          ssh hostinger "set -e; cd '$REMOTE_APP_DIR'; \
            git fetch origin main --quiet; \
            git checkout --quiet ${{ inputs.release_ref }}; \
            docker compose build; \
            docker compose up -d"
          echo "Deployed ${{ inputs.release_ref }}."

      - name: Wait for health
        id: health
        if: ${{ !inputs.plan_only && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then echo "Healthy after ${i} attempt(s)."; exit 0; fi
            sleep 5
          done
          echo "::error::$HEALTH_URL did not return 200 within 150 seconds."
          exit 1

      - name: Post-deploy state
        id: after
        if: ${{ !inputs.plan_only && steps.health.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          counts="$(ssh hostinger "cd '$REMOTE_APP_DIR' && docker compose exec -T wms node -e \"
            const db = require('better-sqlite3')('$REMOTE_DB_PATH', {readonly:true});
            const n = (t) => db.prepare('SELECT COUNT(*) c FROM ' + t).get().c;
            console.log(JSON.stringify({
              migrations: n('schema_migrations'), users: n('users'), materials: n('materials'),
              batches: n('batches'), requests: n('material_request_headers'),
              integrity: db.pragma('integrity_check')[0].integrity_check,
            }));
          \"")"
          echo "After: $counts"
          # A schema migration must not change a row count. If one did, the deploy
          # is not merely suspect — data moved, and that is the one thing this
          # pipeline exists to catch before anyone builds on top of it.
          node -e "
            const before = JSON.parse(process.argv[1]);
            const after = JSON.parse(process.argv[2]);
            const problems = [];
            if (after.integrity !== 'ok') problems.push('integrity is ' + after.integrity);
            for (const k of ['users', 'materials', 'batches', 'requests']) {
              if (before[k] !== after[k]) problems.push(k + ' changed from ' + before[k] + ' to ' + after[k]);
            }
            if (after.migrations < before.migrations) problems.push('migration count went backwards');
            if (problems.length) { console.error('::error::' + problems.join('; ')); process.exit(1); }
            console.log('Row counts unchanged, integrity ok, migrations ' + before.migrations + ' -> ' + after.migrations);
          " '${{ steps.before.outputs.counts }}' "$counts"

      - name: Roll back
        if: ${{ !inputs.plan_only && (steps.deploy.outcome != 'success' || steps.health.outcome != 'success' || steps.after.outcome != 'success') }}
        env:
          CURRENT: ${{ steps.current.outputs.current_sha }}
        run: |
          set -Eeuo pipefail
          echo "::warning::Rolling back to $CURRENT."
          ssh hostinger "set -e; cd '$REMOTE_APP_DIR'; \
            git checkout --quiet $CURRENT; \
            docker compose build; \
            docker compose up -d"
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "::error::Deploy failed and was rolled back to $CURRENT. Production is healthy on the previous commit."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Deploy failed AND the rollback did not come back healthy. Production is down — restore from the backup taken at the start of this run (docs/WMS-PRODUCTION-RUNBOOK.md)."
          exit 1

      - name: Summary
        if: ${{ !inputs.plan_only && steps.deploy.outcome == 'success' && steps.health.outcome == 'success' && steps.after.outcome == 'success' }}
        env:
          CURRENT: ${{ steps.current.outputs.current_sha }}
        run: |
          echo "Deployed ${{ inputs.release_ref }} (was $CURRENT)."
          echo "Health 200, row counts unchanged, database integrity ok."
