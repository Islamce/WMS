name: Manual production release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full commit SHA from main to deploy manually after CI passes.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wms-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate requested release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.release_ref }}

  deploy:
    name: Deploy manually approved release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://wms.kynox.io/healthz
    env:
      REMOTE_APP_DIR: /home/u716763642/domains/wms.kynox.io/.builds/current/nodejs
      REMOTE_NODE: /opt/alt/alt-nodejs20/root/usr/bin/node
      REMOTE_BACKUP_DIR: /home/u716763642/secure/wms-backups
      REMOTE_DB_PATH: /home/u716763642/domains/wms.kynox.io/nodejs/data/wms.db
      WMS_HEALTH_URL: https://wms.kynox.io/healthz
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify release ref is the current main commit
        id: release
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_ref must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          main_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_REF" != "$main_sha" ]]; then
            echo "Refusing deployment: release_ref is not the current main commit."
            echo "expected main=$main_sha"
            exit 1
          fi
          printf 'release_sha=%s\n' "$main_sha" >> "$GITHUB_OUTPUT"

      - name: Validate existing deployment credentials
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -Eeuo pipefail
          for name in SSH_KEY KNOWN_HOSTS SSH_HOST SSH_USER SSH_PORT; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required existing repository deployment secret: $name"
              exit 1
            fi
          done
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]

      - name: Configure pinned Hostinger SSH access
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_wms_release
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_wms_release ~/.ssh/known_hosts
          {
            echo "Host hostinger"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_wms_release"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy through Hostinger Passenger safety gates
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          ssh hostinger "bash -s -- '$REMOTE_APP_DIR' '$REMOTE_NODE' '$REMOTE_BACKUP_DIR' '$REMOTE_DB_PATH' '$DEPLOY_SHA' '$WMS_HEALTH_URL'" <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="$1"
          NODE_BIN="$2"
          BACKUP_DIR="$3"
          DB_PATH="$4"
          DEPLOY_SHA="$5"
          HEALTH_URL="$6"

          cd "$APP_DIR"
          pwd
          test -d .git
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$($NODE_BIN --version)" = "v20.19.4"

          # Take and verify a consistent production backup before any migration or code update.
          BACKUP_DIR="$BACKUP_DIR" DB_PATH="$DB_PATH" "$NODE_BIN" scripts/backup.js
          BACKUP_DIR="$BACKUP_DIR" "$NODE_BIN" scripts/verify-backup.js

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
          # Native addon replacement is a separate audited procedure. This release path accepts only
          # application changes that retain the current dependency lockfiles on the live Hostinger build.
          if ! git diff --quiet HEAD "$DEPLOY_SHA" -- package.json package-lock.json; then
            echo "Refusing deployment: package manifest changed. Use the dedicated native-addon release procedure."
            exit 1
          fi

          git checkout main
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

          grep -qx 'NODE_ENV=production' .env
          grep -qx 'SKIP_AUTO_SEED=1' .env
          grep -qx 'ALLOW_AUTO_SEED=0' .env
          grep -qx 'PRODUCTION_INITIALIZATION_ENABLED=false' .env
          grep -qx "DB_PATH=$DB_PATH" .env

          DB_PATH="$DB_PATH" "$NODE_BIN" server/db/migrate.js
          mkdir -p tmp
          touch tmp/restart.txt
          sleep 8
          curl -fsS "$HEALTH_URL"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          printf 'DEPLOYED_SHA=%s\n' "$DEPLOY_SHA"
          REMOTE

      - name: Verify public health endpoint
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 3 --retry-delay 3 "$WMS_HEALTH_URL"

      - name: Scrub release SSH key
        if: always()
        run: rm -f ~/.ssh/id_wms_release
