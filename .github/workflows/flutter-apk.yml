name: Build WMS Mobile APK

# Builds the Flutter Android APKs on GitHub's runners (unrestricted network) and
# uploads them as downloadable artifacts. Trigger manually from the Actions tab
# or on any push that touches the app.
on:
  push:
    paths:
      - "wms flutter application/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "wms flutter application"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APKs (per ABI + universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wms-mobile-apk
          path: "wms flutter application/build/app/outputs/flutter-apk/*.apk"
          if-no-files-found: error
