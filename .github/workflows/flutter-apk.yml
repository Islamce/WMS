name: Build WMS Mobile APK

# Builds the Flutter Android APKs on GitHub's runners (unrestricted network),
# uploads them as workflow artifacts, and — on pushes to main — publishes the
# universal + per-ABI APKs to a GitHub Release so they have a permanent,
# one-click download link. Trigger manually from the Actions tab or on any push
# that touches the app.
on:
  push:
    paths:
      - "wms flutter application/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "wms flutter application"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # Firebase push notifications: if the repo has a GOOGLE_SERVICES_JSON
      # secret (the raw contents of the Firebase google-services.json file),
      # write it into the app so the build wires up FCM. Without the secret the
      # build proceeds unchanged and push stays a no-op — see
      # DEPLOY-HOSTINGER.md "Real push notifications".
      - name: Add Firebase config (optional, from repo secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written — push notifications ENABLED in this build."
          else
            echo "No GOOGLE_SERVICES_JSON secret — building without push notifications."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APKs (per ABI + universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # Per-APK integrity manifest: prints filename, byte size and SHA-256 for
      # every built APK, and fails the job if none are found. Reusable as-is for
      # every future build — no application code involved.
      - name: APK checksums (SHA-256)
        run: |
          set -euo pipefail
          dir=build/app/outputs/flutter-apk
          count=$(find "$dir" -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK files found in $dir"; exit 1
          fi
          echo "## APK checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '| file | bytes | sha256 |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for apk in "$dir"/*.apk; do
            name=$(basename "$apk")
            bytes=$(stat -c%s "$apk")
            sha=$(sha256sum "$apk" | awk '{print $1}')
            echo "$name  bytes=$bytes  sha256=$sha"
            echo "| $name | $bytes | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Read app version
        id: ver
        run: |
          raw=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tagver=$(echo "$raw" | tr '+' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload APKs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wms-mobile-apk
          path: "wms flutter application/build/app/outputs/flutter-apk/*.apk"
          if-no-files-found: error

      # On main, publish the APKs to a GitHub Release so there's a stable,
      # one-click download link (Releases -> Latest). Paths are from the repo
      # root (working-directory does not apply to action inputs).
      - name: Publish APK to a GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.ver.outputs.tagver }}-${{ github.run_number }}
          name: WMS Mobile v${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            WMS Mobile Android build v${{ steps.ver.outputs.version }}.

            Install **app-release.apk** on any device (enable "Install unknown apps"
            first), or use the matching per-ABI file for a smaller download.
          files: |
            wms flutter application/build/app/outputs/flutter-apk/app-release.apk
            wms flutter application/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            wms flutter application/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            wms flutter application/build/app/outputs/flutter-apk/app-x86_64-release.apk
