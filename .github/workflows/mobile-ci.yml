name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'wms flutter application/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms flutter application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: APK checksums
        run: |
          set -Eeuo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wms-mobile-apk-${{ github.sha }}
          path: |
            wms flutter application/build/app/outputs/flutter-apk/app-release.apk
            wms flutter application/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
