name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find server public/js index.js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run end-to-end test suites
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (Playwright)
        run: npm run test:smoke
