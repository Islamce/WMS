name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git reference to validate when CI is called by another workflow.
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find server public/js index.js tests/load -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint (ESLint + security plugin)
        run: npm run lint

      # The architecture context is generated from the kaaf.module.json
      # manifests. Without this gate it rots silently: it was last generated on
      # 2026-08-01, and by 2026-09-14 it still described production as running
      # under Passenger on a host retired a week earlier — a description an
      # agent would have acted on. Nothing ran it, so nobody knew.
      #
      # Two checks, because they catch different failures. --check fails when
      # the committed context no longer matches the manifests or was hand
      # edited. The drift read fails when the manifests and the code disagree:
      # an undeclared dependency, or an import cycle. Python standard library
      # only, so there is nothing to install.
      - name: Architecture context is current (KAAF)
        run: python3 scripts/architecture/generate.py --check

      - name: Architecture manifests match the code (KAAF drift)
        run: |
          python3 - <<'PY'
          import json, sys
          drift = json.load(open('.ai/drift.json'))
          counts = drift.get('counts', {})
          findings = [f for f in drift.get('findings', []) if f.get('severity') == 'error']
          print(f"drift: {counts.get('error', 0)} error(s), "
                f"{counts.get('warning', 0)} warning(s), {counts.get('info', 0)} info")
          for f in findings:
              print(f"::error::{f['summary']} — {f.get('recommendation', '')}")
              for e in f.get('evidence', [])[:5]:
                  print(f"    {e}")
          sys.exit(1 if findings else 0)
          PY

      - name: Dependency vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Run end-to-end test suites
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/wms-e2e.log

      - name: Upload E2E diagnostic log
        if: always()
        # Best-effort diagnostic upload — must never fail the job. When the
        # account's Actions artifact storage quota is exhausted, CreateArtifact
        # errors out; that is an infrastructure condition, not a test failure,
        # so it should not gate the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wms-e2e-diagnostic
          path: |
            /tmp/wms-e2e.log
            /tmp/wms-test-server.log
          if-no-files-found: warn
          retention-days: 3

      - name: Local bounded load test
        run: |
          set -Eeuo pipefail
          rm -f data/wms.db data/wms.db-shm data/wms.db-wal
          npm run migrate >/dev/null
          npm run seed >/dev/null
          node index.js >/tmp/wms-load-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3000/healthz >/dev/null
          npm run test:load

      - name: Install Playwright browser
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if timeout 210 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright browser install attempt ${attempt} failed or timed out; retrying..."
            sleep 5
          done
          echo "Playwright browser install failed after 3 attempts."
          exit 1

      - name: Browser smoke test (Playwright)
        run: npm run test:smoke
