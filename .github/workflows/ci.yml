name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find server public/js index.js tests/load -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint (ESLint + security plugin)
        run: npm run lint

      - name: Dependency vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Run end-to-end test suites
        run: npm test

      - name: Local bounded load test
        run: |
          set -Eeuo pipefail
          rm -f data/wms.db data/wms.db-shm data/wms.db-wal
          npm run migrate >/dev/null
          npm run seed >/dev/null
          node index.js >/tmp/wms-load-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3000/healthz >/dev/null
          npm run test:load

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (Playwright)
        run: npm run test:smoke
