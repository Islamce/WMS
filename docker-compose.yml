# One-command deploy for a Hostinger VPS (or any Docker host).
#   docker compose up -d --build      # build + start
#   docker compose run --rm wms npm run migrate # schema only; never seed production
#   docker compose logs -f            # tail logs
services:
  wms:
    build: .
    restart: unless-stopped
    ports:
      # Local diagnostic access only. Caddy reaches the service over `web`.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # REQUIRED: replace with a real secret (see .env.example for how to make one).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or a .env file}
      JWT_EXPIRES_IN: 8h
      DB_PATH: /app/data/wms.db
      SKIP_AUTO_SEED: "1"
      ALLOW_AUTO_SEED: "0"
      PRODUCTION_INITIALIZATION_ENABLED: "false"
    volumes:
      # Keep SQLite on a stable host path so restores and verified backups do
      # not depend on Docker's opaque named-volume location.
      - ./data:/app/data
      # The offsite workflow runs the tested backup scripts inside this
      # container, while SSH/SCP accesses the resulting sets on the host.
      - ./backups:/app/backups
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true
