name: wms_mobile
description: "WMS Mobile — Warehouse Management System companion app (Flutter)."
publish_to: "none"
version: 1.3.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  # Camera barcode/QR scanning (QR, Code128, EAN-13, GS1 DataMatrix, …).
  # 7.3.0+ required: earlier 7.x fails to build under Android Gradle Plugin 9.
  mobile_scanner: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
