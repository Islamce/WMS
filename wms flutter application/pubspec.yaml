name: wms_mobile
description: "WMS Mobile — Warehouse Management System companion app (Flutter)."
publish_to: "none"
version: 1.6.1+10

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  # Camera barcode/QR scanning (QR, Code128, EAN-13, GS1 DataMatrix, …).
  # 7.3.0+ required: earlier 7.x fails to build under Android Gradle Plugin 9.
  mobile_scanner: ^7.3.0
  # Real device push notifications (Firebase Cloud Messaging). Inert until the
  # operator adds their own google-services.json (see DEPLOY-HOSTINGER.md).
  # Latest majors pinned as the floor since AGP 9 support is very recent.
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  # Renders every FCM data-only message as an Android system-tray notification
  # in all app states (foreground/background/terminated) on the wms_notifications
  # channel. Requires core-library desugaring (enabled in android/app/build.gradle.kts).
  flutter_local_notifications: ^22.1.0
  # Online/offline detection, so offline-recorded writes can be queued and
  # synced automatically once connectivity returns.
  connectivity_plus: ^6.1.0
  # Reads the real installed version/build number for the Settings footer.
  package_info_plus: ^8.1.2
  # Optional app-lock: delegates to the device's own biometric/PIN/pattern
  # prompt — the app never stores or checks a credential itself.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/kynox_mark.png
